name: Validate Rojo project

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Rojo 7.7.1
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip \
            --output /tmp/rojo.zip
          unzip -q /tmp/rojo.zip -d /tmp/rojo_release
          sudo install /tmp/rojo_release/rojo /usr/local/bin/rojo
          rojo --version
      - name: Build game
        run: rojo build default.project.json --output /tmp/zombie-outbreak.rbxlx
      - name: Validate generated map
        run: |
          test -s /tmp/zombie-outbreak.rbxlx
          grep -q 'ZO_Survival' /tmp/zombie-outbreak.rbxlx
          grep -q '00_StreetAndSite' /tmp/zombie-outbreak.rbxlx
          grep -q '05_EmergencyEscape' /tmp/zombie-outbreak.rbxlx
          echo "Map present in compiled .rbxlx"
