name: Validate Rojo project

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check K-17 map and circulation
        run: |
          python scripts/build_k17.py --check
          python scripts/build_k17_barricades.py --check
          python scripts/validate_k17.py --quiet
          python scripts/validate_refuges.py
          python scripts/check_studio_file.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile Luau scripts
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/luau-lang/luau/releases/download/0.742/luau-ubuntu.zip \
            --output /tmp/luau.zip
          echo '152058b98c60ff1f5b5ec9bca0b8eb37793cae161dd3a05608cc3d8738ba1a4d  /tmp/luau.zip' | sha256sum --check
          unzip -q /tmp/luau.zip -d /tmp/luau_release
          find src tests tools -name '*.luau' -print0 | xargs -0 /tmp/luau_release/luau-compile --null
          /tmp/luau_release/luau tests/barricades/rules.spec.luau
          /tmp/luau_release/luau tests/barricades/physics.spec.luau
          /tmp/luau_release/luau tests/gameplay/rules.spec.luau
          /tmp/luau_release/luau tests/gameplay/loadout.spec.luau
          /tmp/luau_release/luau tests/gameplay/containment.spec.luau
          python scripts/test_round_controller.py --luau /tmp/luau_release/luau
          python scripts/test_combat_controller.py --luau /tmp/luau_release/luau
          python scripts/test_survival_cycle.py --luau /tmp/luau_release/luau
          python scripts/test_loadout_client.py --luau /tmp/luau_release/luau
          python scripts/test_weapons_client.py --luau /tmp/luau_release/luau
          python scripts/test_weapon_aim_pose.py --luau /tmp/luau_release/luau
          python scripts/test_equipment_visuals.py --luau /tmp/luau_release/luau
          python scripts/test_weapon_import.py --luau /tmp/luau_release/luau
          python scripts/test_weapon_bootstrap.py --luau /tmp/luau_release/luau
          python scripts/test_weapon_capture.py --luau /tmp/luau_release/luau
          python tests/barricades/run_runtime.py --luau /tmp/luau_release/luau
      - name: Install Rojo 7.7.1
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip \
            --output /tmp/rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/rojo.zip' | sha256sum --check
          unzip -q /tmp/rojo.zip -d /tmp/rojo_release
          sudo install /tmp/rojo_release/rojo /usr/local/bin/rojo
          rojo --version
      - name: Build game
        run: |
          rojo build third_party/roblox-weapon-kit/upstream.project.json --output /tmp/upstream-weapons.rbxlx
          python scripts/extract_reused_weapon_kit.py /tmp/upstream-weapons.rbxlx --check
          rojo build default.project.json --output /tmp/k17.rbxlx
          rojo build default.project.json --output /tmp/ZombieOutbreakReborn_K17.rbxl
          python scripts/check_studio_file.py --binary /tmp/ZombieOutbreakReborn_K17.rbxl --manifest /tmp/K17.release.json --write
          python scripts/build_studio_survival_test.py --output /tmp/ZombieOutbreakReborn_SurvivalTest.rbxl
          python scripts/build_studio_survival_test.py --output /tmp/survival-test.rbxlx
      - name: Validate generated map
        run: |
          python scripts/validate_k17.py --quiet --place /tmp/k17.rbxlx --binary /tmp/ZombieOutbreakReborn_K17.rbxl
          python scripts/validate_gameplay.py --place /tmp/k17.rbxlx
          python scripts/validate_gameplay.py --place /tmp/survival-test.rbxlx --studio-test
      - name: Upload playable Studio place
        uses: actions/upload-artifact@v4
        with:
          name: ZombieOutbreakReborn-K17
          path: |
            /tmp/ZombieOutbreakReborn_K17.rbxl
            /tmp/K17.release.json
            /tmp/ZombieOutbreakReborn_SurvivalTest.rbxl
