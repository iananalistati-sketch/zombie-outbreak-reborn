name: Assemble licensed Harbor Locks architecture

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/assemble-harbor-locks.yml
      - scripts/assemble_harbor_locks.py

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GLB geometry dependencies
        run: pip install 'trimesh>=4,<5' 'numpy>=1.26,<3' 'pillow>=10'
      - name: Download source-authorized CC0 enterable industrial buildings
        run: |
          mkdir -p third_party/harbor-locks/enterable
          base="https://raw.githubusercontent.com/AetherRadar/operation-steel-tide/d6a33b932e00fb9016dea407eca3f909aeaf2dcb/assets/models/kenney_city_kit_industrial"
          for n in a c e f g h j l n q r t; do
            curl -fLsS --retry 3 "${base}/enterable/building-${n}-enterable.glb" -o "third_party/harbor-locks/enterable/building-${n}-enterable.glb"
          done
          curl -fLsS --retry 3 "${base}/building-b.glb" -o third_party/harbor-locks/building-b.glb
      - name: Assemble real sourced geometry
        run: python scripts/assemble_harbor_locks.py
      - name: Commit validated GLB and build report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/maps/HarborLocks_Survival_Visual.glb assets/maps/HarborLocks_BuildReport.json
          git add third_party/harbor-locks/enterable third_party/harbor-locks/building-b.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets: assemble Harbor Locks scene from CC0 enterable industrial models [skip ci]"
          git push
